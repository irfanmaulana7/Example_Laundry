<!DOCTYPE html>
<html>
<head>
    <title>Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="card p-3 shadow">
        <h4>Tambah Member</h4>

        <form method="POST">
            <input name="id" placeholder="ID" class="form-control mb-2">
            <input name="nama" placeholder="Nama" class="form-control mb-2">
            <input name="hp" placeholder="HP" class="form-control mb-2">

            <button class="btn btn-primary w-100">Tambah</button>
        </form>
    </div>

    <div class="card mt-3 p-3 shadow">
        <h4>Data Member</h4>

        <table class="table table-striped">
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>HP</th>
            </tr>

            {% for d in data %}
            <tr>
                <td>{{ d[0] }}</td>
                <td>{{ d[1] }}</td>
                <td>{{ d[2] }}</td>
            </tr>
            {% endfor %}
        </table>

        <a href="/" class="btn btn-secondary">Kembali</a>
    </div>

</div>

</body>
</html>
